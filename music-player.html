<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Space Grotesk', sans-serif;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .player {
    width: 340px;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    border-radius: 24px;
    padding: 28px 24px 24px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.07);
    position: relative;
    overflow: hidden;
  }

  .player::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(138,92,246,0.3) 0%, transparent 70%);
    pointer-events: none;
  }
  .player::after {
    content: '';
    position: absolute;
    bottom: -40px; left: -40px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(59,130,246,0.2) 0%, transparent 70%);
    pointer-events: none;
  }

  .album-art {
    width: 180px; height: 180px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8a5cf6, #3b82f6, #06b6d4);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    box-shadow: 0 8px 32px rgba(138,92,246,0.4);
    transition: transform 0.3s ease;
  }
  .album-art.spinning {
    animation: spin 8s linear infinite;
  }
  .album-art svg {
    width: 72px; height: 72px;
    opacity: 0.9;
  }
  .album-art .center-dot {
    position: absolute;
    width: 20px; height: 20px;
    background: #1a1630;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.15);
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .track-info {
    text-align: center;
    margin-bottom: 20px;
  }
  .track-title {
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-artist {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    font-weight: 400;
  }

  .progress-section { margin-bottom: 20px; }

  .progress-bar {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    margin-bottom: 8px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #8a5cf6, #3b82f6);
    border-radius: 2px;
    width: 0%;
    transition: width 0.3s linear;
    position: relative;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    right: 0; top: 50%;
    transform: translateY(-50%);
    width: 10px; height: 10px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(138,92,246,0.8);
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    font-weight: 400;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 20px;
  }

  .ctrl-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: rgba(255,255,255,0.5);
    display: flex; align-items: center; justify-content: center;
    transition: color 0.2s, transform 0.15s;
    padding: 4px;
  }
  .ctrl-btn:hover { color: rgba(255,255,255,0.9); transform: scale(1.1); }
  .ctrl-btn:active { transform: scale(0.95); }

  .ctrl-btn.active { color: #8a5cf6; }

  .play-btn {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, #8a5cf6, #3b82f6);
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(138,92,246,0.5);
  }
  .play-btn:hover { transform: scale(1.06); box-shadow: 0 6px 28px rgba(138,92,246,0.7); }
  .play-btn:active { transform: scale(0.96); }

  .volume-section {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .vol-icon { color: rgba(255,255,255,0.4); flex-shrink: 0; }

  input[type=range] {
    -webkit-appearance: none;
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px;
    background: #8a5cf6;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 6px rgba(138,92,246,0.6);
  }

  .upload-section {
    margin-top: 16px;
    text-align: center;
  }
  .upload-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: rgba(255,255,255,0.35);
    cursor: pointer;
    padding: 6px 14px;
    border: 1px dashed rgba(255,255,255,0.15);
    border-radius: 20px;
    transition: all 0.2s;
  }
  .upload-label:hover {
    color: rgba(255,255,255,0.7);
    border-color: rgba(138,92,246,0.5);
    background: rgba(138,92,246,0.08);
  }
  .upload-label input { display: none; }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #22c55e;
    display: inline-block;
    margin-right: 4px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .loop-badge {
    position: absolute;
    top: 14px; right: 16px;
    font-size: 10px;
    color: rgba(138,92,246,0.8);
    background: rgba(138,92,246,0.12);
    border: 1px solid rgba(138,92,246,0.25);
    border-radius: 10px;
    padding: 3px 8px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="player">
  <span class="loop-badge">&#x1F501; LOOP</span>

  <div class="album-art" id="albumArt">
    <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </svg>
    <div class="center-dot"></div>
  </div>

  <div class="track-info">
    <div class="track-title" id="trackTitle">Pilih file musik...</div>
    <div class="track-artist" id="trackArtist">
      <span class="status-dot" id="statusDot" style="background:#888;animation:none;"></span>
      <span id="statusText">Belum ada musik</span>
    </div>
  </div>

  <div class="progress-section">
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="time-row">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="shuffleBtn" title="Shuffle" onclick="toggleShuffle()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 3 21 3 21 8"/><polyline points="4 20 9 20 9 15"/>
        <path d="M21 3l-7 7-4-4-6 6"/><path d="M9 15l-5 5"/>
      </svg>
    </button>
    <button class="ctrl-btn" onclick="prevTrack()" title="Sebelumnya">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/>
      </svg>
    </button>
    <button class="play-btn" id="playBtn" onclick="togglePlay()">
      <svg id="playIcon" width="24" height="24" viewBox="0 0 24 24" fill="white" stroke="none">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
    </button>
    <button class="ctrl-btn" onclick="nextTrack()" title="Berikutnya">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/>
      </svg>
    </button>
    <button class="ctrl-btn active" id="loopBtn" title="Ulangi" onclick="toggleLoop()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
        <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
      </svg>
    </button>
  </div>

  <div class="volume-section">
    <svg class="vol-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
    </svg>
    <input type="range" id="volumeSlider" min="0" max="100" value="80" oninput="setVolume(this.value)">
    <svg class="vol-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
    </svg>
  </div>

  <div class="upload-section">
    <label class="upload-label">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      Upload Musik
      <input type="file" id="fileInput" accept="audio/*" multiple onchange="loadFiles(this.files)">
    </label>
  </div>
</div>

<audio id="audio" loop></audio>

<script>
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const progressFill = document.getElementById('progressFill');
const progressBar = document.getElementById('progressBar');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const trackTitle = document.getElementById('trackTitle');
const trackArtist = document.getElementById('trackArtist');
const albumArt = document.getElementById('albumArt');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const loopBtn = document.getElementById('loopBtn');
const shuffleBtn = document.getElementById('shuffleBtn');

let playlist = [];
let currentIndex = 0;
let isLoop = true;
let isShuffle = false;
let isPlaying = false;

audio.volume = 0.8;
audio.loop = true;

function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function loadFiles(files) {
  playlist = [];
  for (let f of files) {
    playlist.push({ name: f.name.replace(/\.[^/.]+$/, ''), url: URL.createObjectURL(f) });
  }
  if (playlist.length > 0) {
    currentIndex = 0;
    loadTrack(currentIndex);
    playTrack();
  }
}

function loadTrack(idx) {
  const track = playlist[idx];
  audio.src = track.url;
  trackTitle.textContent = track.name;
  statusText.textContent = 'Memutar...';
  statusDot.style.background = '#22c55e';
  statusDot.style.animation = 'pulse 2s ease-in-out infinite';
}

function playTrack() {
  audio.play().catch(() => {});
  isPlaying = true;
  playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1" fill="white"/><rect x="14" y="4" width="4" height="16" rx="1" fill="white"/>';
  albumArt.classList.add('spinning');
}

function pauseTrack() {
  audio.pause();
  isPlaying = false;
  playIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3" fill="white"/>';
  albumArt.classList.remove('spinning');
}

function togglePlay() {
  if (playlist.length === 0) return;
  isPlaying ? pauseTrack() : playTrack();
}

function prevTrack() {
  if (playlist.length === 0) return;
  currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
  loadTrack(currentIndex);
  playTrack();
}

function nextTrack() {
  if (playlist.length === 0) return;
  if (isShuffle) currentIndex = Math.floor(Math.random() * playlist.length);
  else currentIndex = (currentIndex + 1) % playlist.length;
  loadTrack(currentIndex);
  playTrack();
}

function toggleLoop() {
  isLoop = !isLoop;
  audio.loop = isLoop;
  loopBtn.style.color = isLoop ? '#8a5cf6' : 'rgba(255,255,255,0.5)';
}

function toggleShuffle() {
  isShuffle = !isShuffle;
  shuffleBtn.style.color = isShuffle ? '#8a5cf6' : 'rgba(255,255,255,0.5)';
}

function setVolume(val) { audio.volume = val / 100; }

audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
    currentTimeEl.textContent = fmt(audio.currentTime);
    totalTimeEl.textContent = fmt(audio.duration);
  }
});

audio.addEventListener('ended', () => {
  if (!isLoop) nextTrack();
});

progressBar.addEventListener('click', e => {
  if (!audio.duration) return;
  const rect = progressBar.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
});

// Coba autoplay saat halaman dibuka jika ada URL musik tersimpan
// (untuk Google Sites: upload musik melalui tombol di atas)
</script>
</body>
</html>
